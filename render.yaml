services:
  - type: web
    name: Erwin-Bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: PREFIX
        value: "-"
      - key: SESSION_DATA
        sync: false
